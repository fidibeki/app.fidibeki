name: fidibeki

x-api-environment: &api-environment
  APP_ENV: local
  APP_VERSION: local
  LOG_LEVEL: debug
  HTTP_ADDRESS: :8080
  BASE_DOMAIN: localhost
  PUBLIC_BASE_URL: http://api.localhost:8088
  # The Nuxt dev server terminates browser-facing tenant URLs locally. Override
  # when it runs on a different port.
  WEB_PUBLIC_BASE_URL: ${WEB_PUBLIC_BASE_URL:-http://api.localhost:3000}
  PLATFORM_BACKOFFICE_URL: ${PLATFORM_BACKOFFICE_URL:-http://admin.localhost:3001}
  DATABASE_URL_APP: postgres://fidibeki_app:fidibeki-app-local@pgbouncer:6432/fidibeki?sslmode=disable
  DATABASE_URL_ADMIN: postgres://fidibeki_admin:fidibeki-admin-local@pgbouncer:6432/fidibeki?sslmode=disable
  DATABASE_URL_DIRECT: postgres://postgres:postgres@postgres:5432/fidibeki?sslmode=disable
  DATABASE_APP_MAX_CONNS: 10
  DATABASE_ADMIN_MAX_CONNS: 5
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_BUCKET: fidibeki
  S3_ACCESS_KEY: fidibeki-local
  S3_SECRET_KEY: fidibeki-local-secret
  S3_VIRTUAL_HOST_STYLE: "false"
  S3_AUTO_CREATE_BUCKET: "true"
  JWT_SECRET: local-only-jwt-secret-change-before-production
  INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:-local-only-internal-proxy-secret-change-me}
  INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:-ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=}
  AUTH_ACCESS_TOKEN_TTL: 10m
  AUTH_MAGIC_LINK_TTL: 10m
  AUTH_REFRESH_TOKEN_TTL: 720h
  AUTH_REFRESH_RETRY_GRACE: 10s
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
  STRIPE_PRICE_GROWTH: ${STRIPE_PRICE_GROWTH:-}
  STRIPE_PRICE_SCALE: ${STRIPE_PRICE_SCALE:-}
  STRIPE_PRICE_STARTER_YEARLY: ${STRIPE_PRICE_STARTER_YEARLY:-}
  STRIPE_PRICE_GROWTH_YEARLY: ${STRIPE_PRICE_GROWTH_YEARLY:-}
  STRIPE_PRICE_SCALE_YEARLY: ${STRIPE_PRICE_SCALE_YEARLY:-}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
  # Slack one-click install. Empty leaves the install button hidden and the manual
  # webhook-URL path working. SLACK_REDIRECT_URL must be HTTPS and match a redirect URL
  # registered on the Slack app exactly, so testing it locally needs a tunnel that
  # rewrites the Host header to api.${BASE_DOMAIN}.
  SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
  SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
  SLACK_REDIRECT_URL: ${SLACK_REDIRECT_URL:-}
  EMAIL_DRIVER: capture
  EMAIL_CAPTURE_DIR: /var/lib/fidibeki-emails
  EMAIL_TASK_SIGNING_KEY: ${EMAIL_TASK_SIGNING_KEY:-ZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWU=}
  EMAIL_TASK_PREVIOUS_SIGNING_KEY: ${EMAIL_TASK_PREVIOUS_SIGNING_KEY:-}
  EMAIL_QUEUE_CONCURRENCY: 20
  DOMAIN_QUEUE_CONCURRENCY: 4
  MEDIA_QUEUE_CONCURRENCY: 2
  PRIVACY_QUEUE_CONCURRENCY: 1
  RESEND_AUTH_FROM: Fidibeki <auth@fidibeki.com>
  RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
  REPORTER_UNSUBSCRIBE_TTL: ${REPORTER_UNSUBSCRIBE_TTL:-2160h}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: gemini-2.5-flash
  GEMINI_RPM: 15
  AI_QUEUE_CONCURRENCY: 3
  AI_DAILY_REQUEST_LIMIT: 5000
  AI_PROJECT_DAILY_REQUEST_LIMIT: 2000
  AI_RECONCILE_INTERVAL: 5m
  MIGRATIONS_PATH: /app/migrations
  READINESS_TIMEOUT: 2s
  SHUTDOWN_TIMEOUT: 10s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fidibeki
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fidibeki"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - name: postgres-local
        target: 5432
        published: "5433"
        host_ip: 127.0.0.1
        protocol: tcp

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U fidibeki_admin -d fidibeki"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - name: pgbouncer-local
        target: 6432
        published: "6432"
        host_ip: 127.0.0.1
        protocol: tcp

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - name: redis-local
        target: 6379
        published: "6380"
        host_ip: 127.0.0.1
        protocol: tcp

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: fidibeki-local
      MINIO_ROOT_PASSWORD: fidibeki-local-secret
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - name: minio-api-local
        target: 9000
        published: "9000"
        host_ip: 127.0.0.1
        protocol: tcp
      - name: minio-console-local
        target: 9001
        published: "9001"
        host_ip: 127.0.0.1
        protocol: tcp

  migrations:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["migrate", "up"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment: *api-environment
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "8080:8080"

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["worker"]
    environment: *api-environment
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - email-capture:/var/lib/fidibeki-emails

  caddy:
    build:
      context: ..
      dockerfile: infra/caddy/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8088:80"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  email-capture:
