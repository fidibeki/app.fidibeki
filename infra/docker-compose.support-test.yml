name: fidibeki-support-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fidibeki
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:54339:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fidibeki"]
      interval: 1s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6389:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: fidibeki-local
      MINIO_ROOT_PASSWORD: fidibeki-local-secret
    ports: ["127.0.0.1:9009:9000"]
