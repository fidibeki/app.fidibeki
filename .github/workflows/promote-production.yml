name: Promote Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type fidibeki.com to confirm the production promotion
        required: true
        type: string
      ref:
        description: Branch, tag, or commit SHA to promote (pin the exact commit staging validated)
        required: true
        default: main
        type: string
      services:
        description: Which services to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - backend
          - api
          - worker
          - web
          - widget
      release:
        description: Version bump for the release tag pushed after a successful deploy
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write
  deployments: write

jobs:
  promote:
    # Deliberately still GitHub-hosted while CI runs on WarpBuild: this is the
    # only job that sees RAILWAY_PRODUCTION_TOKEN and pushes release tags, so the
    # production deploy path stays off a second vendor's uptime and infrastructure.
    runs-on: warp-ubuntu-latest-x64-4x
    timeout-minutes: 30
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      API_SERVICE: ${{ vars.RAILWAY_API_SERVICE }}
      WORKER_SERVICE: ${{ vars.RAILWAY_WORKER_SERVICE }}
      WEB_SERVICE: ${{ vars.RAILWAY_WEB_SERVICE }}
      WIDGET_SERVICE: ${{ vars.RAILWAY_WIDGET_SERVICE }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Confirm production target
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = "fidibeki.com"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Resolve targets
        id: resolve
        env:
          SERVICES: ${{ inputs.services }}
        run: |
          sha=$(git rev-parse HEAD)
          case "$SERVICES" in
            all) targets="api worker web widget" ;;
            backend) targets="api worker" ;;
            api|worker|web|widget) targets="$SERVICES" ;;
            *) echo "Unknown services selection: $SERVICES" >&2; exit 1 ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Promoting $sha to production: $targets"
      - name: Record deployment start
        id: deployment
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          TARGETS: ${{ steps.resolve.outputs.targets }}
          PROMOTED_REF: ${{ inputs.ref }}
        run: |
          deployment_id=$(gh api "repos/${GITHUB_REPOSITORY}/deployments" \
            -f ref="$SHA" \
            -f environment=production \
            -f task="deploy:${TARGETS// /,}" \
            -f description="Promote $PROMOTED_REF ($TARGETS)" \
            -F auto_merge=false \
            -f 'required_contexts[]' \
            --jq '.id')
          echo "id=$deployment_id" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
            -f state=in_progress \
            -f log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --silent
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --global @railway/cli@5.27.2
      - name: Deploy selected services
        env:
          TARGETS: ${{ steps.resolve.outputs.targets }}
        run: |
          for target in $TARGETS; do
            case "$target" in
              api) service="$API_SERVICE" ;;
              worker) service="$WORKER_SERVICE" ;;
              web) service="$WEB_SERVICE" ;;
              widget) service="$WIDGET_SERVICE" ;;
            esac
            echo "::group::Deploy $target"
            railway up --ci --project "$RAILWAY_PROJECT_ID" --environment production --service "$service"
            echo "::endgroup::"
          done
      - name: Verify production readiness
        run: curl --fail --show-error --retry 12 --retry-delay 10 "$PRODUCTION_API_URL/readyz"
      - name: Record deployment result
        if: always() && steps.deployment.outputs.id != ''
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = "success" ]; then state=success; fi
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="$state" \
            -f log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --silent
      - name: Tag release
        if: inputs.release != 'none'
        env:
          RELEASE: ${{ inputs.release }}
          SHA: ${{ steps.resolve.outputs.sha }}
          TARGETS: ${{ steps.resolve.outputs.targets }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          latest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          latest="${latest:-v0.0.0}"
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$RELEASE" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="v${major}.${minor}.${patch}"
          git tag -a "$version" -m "Production release $version (services: $TARGETS)" "$SHA"
          git push origin "refs/tags/$version"
          echo "Tagged $version at $SHA (previous: $latest)" >> "$GITHUB_STEP_SUMMARY"
