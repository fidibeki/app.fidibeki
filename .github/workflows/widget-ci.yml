name: Widget CI

on:
  pull_request:
    paths:
      - "contracts/**"
      - "widget/**"
      - "infra/Caddyfile"
      - "infra/caddy/**"
      - "railway.widget.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/widget-ci.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "widget/**"
      - "infra/Caddyfile"
      - "infra/caddy/**"
      - "railway.widget.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/widget-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --global pnpm@11.15.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fidibeki/widget typecheck
      - run: pnpm --filter @fidibeki/widget build
      - run: pnpm --filter @fidibeki/widget test
      - run: pnpm --filter @fidibeki/widget exec playwright install --with-deps chromium
      - run: pnpm --filter @fidibeki/widget test:e2e
      - run: docker build --tag fidibeki-widget-ci -f infra/caddy/Dockerfile .
      - name: Verify edge container routing
        run: |
          docker run --detach --name fidibeki-widget-ci --publish 127.0.0.1:8097:80 \
            --env 'WIDGET_HOST=widget-staging.example.test widget.example.test' \
            --env WIDGET_API_UPSTREAM=http://127.0.0.1:65535 \
            --env API_UPSTREAM=http://127.0.0.1:65535 \
            fidibeki-widget-ci
          trap 'docker rm --force fidibeki-widget-ci' EXIT

          for host in widget.example.test healthcheck.internal; do
            response=$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 \
              --header "Host: $host" http://127.0.0.1:8097/healthz)
            test "$response" = "ok"
          done

          curl --fail --silent --show-error \
            --header 'Host: widget.example.test' http://127.0.0.1:8097/v1/widget.js >/dev/null
