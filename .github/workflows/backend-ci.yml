name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: make format-check
      # go vet is not run separately: golangci-lint's standard set enables govet,
      # so `make lint` repeated the same analysis for about 96 seconds. The
      # Makefile target stays for local use.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          working-directory: backend

  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # The short suite is not run first: `make coverage` runs every one of those
      # tests again plus the integration tests they skip, so running both in the
      # same sequential job cost about 150 seconds for no extra signal.
      - name: Run integration tests and enforce coverage
        run: make coverage
      - name: Validate Compose configuration
        run: docker compose -f infra/docker-compose.yml config --quiet
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
      - name: Build API image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: backend/Dockerfile
          push: false
