name: Backoffice CI

on:
  pull_request:
    paths:
      - "backoffice/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/backoffice-ci.yml"
  push:
    branches: [main]
    paths:
      - "backoffice/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/backoffice-ci.yml"

permissions:
  contents: read

concurrency:
  group: backoffice-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: warp-ubuntu-2604-arm64-4x
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fidibeki/backoffice typecheck
      - run: pnpm --filter @fidibeki/backoffice test
      - run: pnpm --filter @fidibeki/backoffice build
      - run: pnpm --filter @fidibeki/backoffice exec playwright install --with-deps chromium
      - run: pnpm --filter @fidibeki/backoffice test:e2e
