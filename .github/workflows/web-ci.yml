name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fidibeki/web typecheck
      - run: pnpm --filter @fidibeki/web test
      - run: pnpm --filter @fidibeki/web build
      - run: pnpm --filter @fidibeki/web exec playwright install --with-deps chromium
      - run: pnpm --filter @fidibeki/web test:e2e
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
      - name: Build web image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: web/Dockerfile
          push: false
