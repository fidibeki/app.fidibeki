name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

# Without this, every superseded push ran the full ten-minute job to completion:
# Web CI cancelled 1 run out of 45 while Backend CI, which already had a group,
# cancelled 28 out of 54 over the same window.
concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: warp-ubuntu-latest-x64-2x
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fidibeki/web typecheck
      - run: pnpm --filter @fidibeki/web test
      - run: pnpm --filter @fidibeki/web build
      - run: pnpm --filter @fidibeki/web exec playwright install --with-deps chromium
      - run: pnpm --filter @fidibeki/web test:e2e

  # web/Dockerfile reruns `pnpm install` and `pnpm --filter @fidibeki/web build`
  # inside the image, duplicating work the verify job above has already done.
  # The gha layer cache cannot absorb it either: `COPY web web` invalidates the
  # build layer exactly when this workflow runs. So the image build is worth
  # paying for on main, where it is what production promotes, and on pull
  # requests only when something that could actually break the image changed --
  # a plain web/ edit is already covered by the verify job's build.
  image:
    runs-on: starsling-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether the image needs building
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "push" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE...HEAD" | grep -qE '^(web/Dockerfile|web/package\.json|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No image-relevant changes; skipping the duplicate Nuxt build." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.decide.outputs.build == 'true'
      - name: Build web image
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          cache-from: type=gha,scope=web-image
          cache-to: type=gha,mode=max,scope=web-image
