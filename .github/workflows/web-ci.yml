name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: npm install --global pnpm@11.15.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fidibeki/web typecheck
      - run: pnpm --filter @fidibeki/web test
      - run: pnpm --filter @fidibeki/web build
      - run: pnpm --filter @fidibeki/web exec playwright install --with-deps chromium
      - run: pnpm --filter @fidibeki/web test:e2e
      - run: docker build -f web/Dockerfile .
