name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fidibeki/web typecheck
      - run: pnpm --filter @fidibeki/web test
      - run: pnpm --filter @fidibeki/web build
      - run: pnpm --filter @fidibeki/web exec playwright install --with-deps chromium
      - run: pnpm --filter @fidibeki/web test:e2e
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          cache-from: type=gha,scope=web-image
          cache-to: type=gha,mode=max,scope=web-image
