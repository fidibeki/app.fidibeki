name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "examples/mobile/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "examples/mobile/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: warp-ubuntu-2604-arm64-4x
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fidibeki/mobile test
      - run: pnpm --filter @fidibeki/mobile typecheck
      - run: pnpm --filter @fidibeki/mobile build
      - run: pnpm --filter @fidibeki/mobile pack:check
      - run: pnpm --filter @fidibeki/mobile-example typecheck
