packages:
  - widget
  - mobile
  - web
  - marketing
  - backoffice
  - examples/mobile
supportedArchitectures:
  os:
    - darwin
    - current
  cpu:
    - arm64
    - x64
allowBuilds:
  esbuild: true
overrides:
  '@vue/server-renderer': ^3.5.44
  '@xmldom/xmldom': ^0.9.12
  baseline-browser-mapping: ^2.11.0
  brace-expansion: ^5.0.12
  browserslist: ^4.28.7
  compression: ^1.8.2
  devalue: ^5.9.3
  fflate: ^0.4.9
  image-size: ^2.0.4
  js-yaml: ^4.3.2
  nanoid: ^3.3.18
  serialize-javascript: ^7.1.3
  shell-quote: ^1.11.0
  source-map-js: ^1.2.2
  vite: 8.3.5
  zod: ^4.6.7
  uuid@<11.1.1: ^11.1.1
minimumReleaseAgeExclude:
  - '@sentry/browser-utils@10.67.0'
  - '@sentry/browser@10.67.0'
  - '@sentry/core@10.67.0'
  - '@sentry/feedback@10.67.0'
  - '@sentry/replay-canvas@10.67.0'
  - '@sentry/replay@10.67.0'
  - '@rrweb/types@2.1.1'
  - '@rrweb/utils@2.1.1'
  - rrdom@2.1.1
  - rrweb-snapshot@2.1.1
  - rrweb@2.1.1
  - '@rrweb/packer@2.1.1'
  - '@rrweb/replay@2.1.1'
  - rrweb-player@2.1.1
  - tar@7.5.21
  - brace-expansion@5.0.8 || 5.0.9
  - uuid@11.1.1
  - esbuild@0.28.1
  - postcss@8.5.23
